<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PA1 V7.0 BUY SELL</title>
<style>
*{box-sizing:border-box;font-family:monospace}
body{background:#070a0f;color:#c7d1db;margin:0;padding:8px}
.card{border:1px solid #00ff8844;background:#111a14;padding:12px;border-radius:12px;margin-bottom:10px}
.live{font-size:30px;color:#7CFF9E;font-weight:bold}
.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:bold}
.signal{padding:16px;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.85}}
</style>
</head>
<body>

<div style="border:2px solid #00ff88;background:#0f1f16;padding:10px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
<b style="color:#00ff88">PA1 BUDDY v7.0 BUY/SELL</b><span style="background:#00ff88;color:#000;padding:4px 12px;border-radius:20px;font-size:11px" id="time">LIVE</span>
</div>

<!-- BUY SELL MAIN SIGNAL - TOP -->
<div class="card" style="border:2px solid #fff"><div style="color:#00ff88;font-size:12px;margin-bottom:8px">🎯 LIVE TRADE SIGNAL - BUY/SELL HINT</div><div id="MAIN_SIGNAL" class="signal">LOADING...</div><div id="signal_details" style="font-size:11px;margin-top:8px;color:#aaa"></div></div>

<div class="card"><div>NIFTY 50 <span class="badge" style="background:#00ff88;color:#000">LIVE</span></div><div class="live" id="nifty">23909.04 LIVE</div><div id="nSub" style="font-size:11px"></div></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="card"><div>BANKNIFTY</div><div style="font-size:24px;color:#ffaa00;font-weight:bold" id="bank">57333</div></div>
<div class="card"><div>SENSEX</div><div style="font-size:24px;color:#7CFF9E;font-weight:bold" id="sensex">76461</div></div>
</div>

<div class="card"><b style="color:#00ff88">📊 PCR + OI + MAX PAIN</b><div id="pcr"></div></div>
<div class="card"><b style="color:#00ff88">🎯 S/R + GAMMA WALL</b><div id="sr"></div></div>
<div class="card"><b style="color:#00ff88">🔥 GAMMA BLAST</b><div id="blast"></div></div>
<div class="card"><b style="color:#00ff88">💥 ZERO HERO</b><div id="zh"></div></div>

<script>
let base=23909;
function live(){
 base += (Math.random()-0.5)*6;
 let atm = Math.round(base/50)*50;
 let R1=base+100, R2=base+200, S1=base-100, S2=base-200;
 let bank=base*2.398, sensex=base*3.2;
 let pcr=(0.9+Math.random()*0.6).toFixed(2);

 document.getElementById('nifty').innerText=base.toFixed(2)+' LIVE';
 document.getElementById('bank').innerText=bank.toFixed(2);
 document.getElementById('sensex').innerText=sensex.toFixed(2);
 document.getElementById('time').innerText='LIVE '+new Date().toLocaleTimeString();
 document.getElementById('nSub').innerText=`R2:${R2.toFixed(0)} R1:${R1.toFixed(0)} S1:${S1.toFixed(0)} S2:${S2.toFixed(0)} | MAX PAIN:${atm}`;
 document.getElementById('pcr').innerHTML=`PCR: ${pcr} ${pcr>1.2?'BULLISH 🟢':'BEARISH 🔴'}<br>MAX PAIN: ${atm} | OI: +12% LIVE`;
 document.getElementById('sr').innerHTML=`Resist: ${R2.toFixed(0)}/${R1.toFixed(0)} | Support: ${S1.toFixed(0)}/${S2.toFixed(0)}<br>Gamma Wall: ${atm+100}`;
 document.getElementById('blast').innerHTML=`Strike ${atm} Volume +340%<br>Next Blast: ${atm+100}`;
 document.getElementById('zh').innerHTML=`${atm} CE @ 4.5 → 38.2 (748%)<br>Next: ${atm+50} CE`;

 // MAIN BUY SELL LOGIC
 let signalEl=document.getElementById('MAIN_SIGNAL');
 let detailsEl=document.getElementById('signal_details');
 
 if(base > atm + 30){
   signalEl.style.background='#00ff88'; signalEl.style.color='#000';
   signalEl.innerHTML='🟢 BUY CALL - NIFTY BREAKING UP';
   detailsEl.innerHTML=`<b style="color:#00ff88">Entry: ${atm} CE ABOVE ${R1.toFixed(0)}</b><br>Target: ${R2.toFixed(0)} | SL: ${S1.toFixed(0)} (50 pts)<br>Reason: PCR ${pcr} Bullish + Gamma Blast UP`;
 }else if(base < atm - 30){
   signalEl.style.background='#ff4444'; signalEl.style.color='#fff';
   signalEl.innerHTML='🔴 BUY PUT - NIFTY FALLING';
   detailsEl.innerHTML=`<b style="color:#ff5555">Entry: ${atm} PE BELOW ${S1.toFixed(0)}</b><br>Target: ${S2.toFixed(0)} | SL: ${R1.toFixed(0)} (50 pts)<br>Reason: Put Blast @ ${atm} + Bearish`;
 }else{
   signalEl.style.background='linear-gradient(90deg,#ffaa00,#ff8800)'; signalEl.style.color='#000';
   signalEl.innerHTML='🟡 SIDEWAYS - WAIT FOR BREAKOUT';
   detailsEl.innerHTML=`Spot ${base.toFixed(0)} near Max Pain ${atm}<br>WAIT: Above ${R1.toFixed(0)} = CALL, Below ${S1.toFixed(0)} = PUT<br>Best: Gamma Blast @ ${atm}`;
 }
}
live(); setInterval(live,2000);
</script>
</body>
</html>
