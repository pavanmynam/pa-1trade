<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PA1 BUDDY v2.6 - Search + Telugu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="terminal">
<header>
<h1>PA1 BUDDY v2.6</h1>
<div style="display:flex;gap:10px;align-items:center">
<div style="display:flex;gap:5px">
<input id="searchInput" type="text" placeholder="NIFTY, RELIANCE..." style="padding:8px 12px;border-radius:20px;border:1px solid #00ff88;background:#111;color:#fff;width:200px">
<button id="searchBtn" style="padding:8px 16px;border-radius:20px;border:none;background:#00ff88;color:#000;font-weight:bold;cursor:pointer">🔍 Search</button>
</div>
<span class="live">● LIVE</span>
</div>
</header>
<div class="grid">
<div class="card highlight" style="grid-column: span 2;">
<h3>🔴 NIFTY LIVE + TRADE HINT</h3>
<h2 id="nifty" style="font-size:36px">Loading...</h2>
<small id="nifty-change">Connecting...</small>
<div id="trade-hint" style="margin-top:15px;padding:12px;border-radius:8px;font-weight:bold;font-size:20px;text-align:center;">LOADING...</div>
<div id="hint-telugu" style="margin-top:12px;padding:14px;border:2px dashed #00ff88;border-radius:10px;background:rgba(0,255,136,0.08);line-height:1.7">Telugu hint vastundi...</div>
</div>
<div class="card"><h3>🔍 SEARCH</h3><p style="font-size:12px">Type: NIFTY, BANKNIFTY, RELIANCE, TCS</p><div id="searchResult" style="margin-top:10px;padding:10px;background:rgba(0,255,136,0.1);border-radius:8px">Result ikkada</div></div>
<div class="card"><h3>📊 LOGIC</h3><p style="font-size:12px">+50 up = BUY CE<br>-50 down = BUY PE<br>Telugu lo clear ga chepta!</p></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
