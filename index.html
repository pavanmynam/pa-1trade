<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PA1 TRADE LIVE SAME</title>
<style>body{background:#000;color:#fff;margin:0;font-family:system-ui;padding:10px} .top{background:linear-gradient(90deg,#0f0,#0a0);color:#000;padding:10px;text-align:center;font-weight:bold;border-radius:10px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px} .card{background:#111;border:1px solid #222;border-radius:14px;padding:14px;text-align:center} .big{font-size:22px;font-weight:bold;color:#0f0} .price{font-size:18px;font-weight:bold} .hint{background:#111;border-left:4px solid #0f0;padding:14px;border-radius:10px;margin-top:10px} .sig{padding:12px;border-radius:10px;font-weight:bold;text-align:center;margin-top:10px} .call{background:#0f0;color:#000} .put{background:#f00;color:#fff} button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:bold;margin-top:8px;font-size:16px}</style></head><body>
<div class="top" id="topBar">PA1 BUDDY v2.4 - LIVE SAME LOADING...</div>
<div class="grid"><div class="card"><div>NIFTY 50</div><div class="big" id="nifty">--</div><div id="niftyTime" style="font-size:11px;color:#888"></div></div><div class="card"><div>BANK NIFTY</div><div class="price" id="bank">--</div><div style="margin-top:6px">SENSEX <b id="sensex">--</b></div></div></div>
<div class="grid"><div class="card">GOLD LIVE<br><span class="price" id="gold">--</span><br><small>₹ <span id="goldInr">--</span> /10g</small></div><div class="card">BTC LIVE<br><span class="price" id="btc">--</span><br><small>DOW <span id="dow">--</span></small></div></div>
<div class="hint" id="hint">ANNA I HINT Loading...</div>
<div class="sig" id="signalBox">SIGNAL Loading...</div>
<div class="grid"><button style="background:#0f0;color:#000" onclick="alert('CALL Trade - NIFTY '+document.getElementById('nifty').innerText)">🟢 CALL / BUY</button><button style="background:#f44;color:#fff" onclick="alert('PUT Trade - NIFTY '+document.getElementById('nifty').innerText)">🔴 PUT / SELL</button></div>
<script>
async function load(){
 try{
  let r=await fetch('/api/spot?t='+Date.now()); let d=await r.json();
  document.getElementById('nifty').innerText=d.nifty+' LIVE';
  document.getElementById('bank').innerText=d.bank;
  document.getElementById('sensex').innerText=d.sensex;
  document.getElementById('gold').innerText='$'+d.gold;
  document.getElementById('goldInr').innerText=d.goldInr;
  document.getElementById('btc').innerText='$'+d.btcUsd;
  document.getElementById('dow').innerText=d.dow;
  document.getElementById('topBar').innerText=`🇮🇳 NIFTY ${d.nifty} | BANK ${d.bank} | GOLD $${d.gold} | BTC $${d.btcUsd} | ${d.hint}`;
  document.getElementById('hint').innerText='ANNA I HINT: '+d.hint;
  let sb=document.getElementById('signalBox'); sb.innerText='SIGNAL: '+d.signal+' | '+d.hint; sb.className='sig '+(d.signal.includes('CALL')?'call':'put');
  document.getElementById('niftyTime').innerText=new Date().toLocaleTimeString();
 }catch(e){console.log(e)}
}
load(); setInterval(load,3000);
</script></body></html>
