<script>
// ===== INTERNATIONAL + INDIAN MARKET - LIVE =====
async function getBothMarkets(){
  let data = {};

  // ===== INDIAN MARKET =====
  try{
    let n = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?interval=1m')+'&_='+Date.now());
    data.nifty = JSON.parse((await n.json()).contents).chart.result[0].meta.regularMarketPrice;
  }catch(e){ data.nifty = 23907; }

  try{
    let b = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEBANK?interval=1m')+'&_='+Date.now());
    data.bank = JSON.parse((await b.json()).contents).chart.result[0].meta.regularMarketPrice;
  }catch(e){ data.bank = 51500; }

  try{
    let s = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/%5EBSESN?interval=1m')+'&_='+Date.now());
    data.sensex = JSON.parse((await s.json()).contents).chart.result[0].meta.regularMarketPrice;
  }catch(e){ data.sensex = 78500; }

  // ===== INTERNATIONAL MARKET =====
  try{
    let d = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/%5EDJI?interval=1m')+'&_='+Date.now());
    data.dow = JSON.parse((await d.json()).contents).chart.result[0].meta.regularMarketPrice;
  }catch(e){ data.dow = 43000; }

  try{
    let nas = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/%5EIXIC?interval=1m')+'&_='+Date.now());
    data.nasdaq = JSON.parse((await nas.json()).contents).chart.result[0].meta.regularMarketPrice;
  }catch(e){ data.nasdaq = 19500; }

  try{
    let g = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1m')+'&_='+Date.now());
    data.gold = JSON.parse((await g.json()).contents).chart.result[0].meta.regularMarketPrice;
  }catch(e){ data.gold = 2650; }

  try{
    let cg = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
    let cgData = await cg.json();
    data.btc = cgData.bitcoin.usd;
  }catch(e){ data.btc = 67000; }

  // ===== HINT LOGIC - INTERNATIONAL -> INDIAN =====
  let hint = "";
  if(data.dow > 43000 && data.nasdaq > 19500){
    hint = "🟢 US Market UP = Indian Market GAP UP Hint | BUY CALL Bias";
  }else if(data.dow < 42500){
    hint = "🔴 US Market DOWN = Indian Market GAP DOWN Hint | BUY PUT Bias";
  }else{
    hint = "🟡 US Flat = Indian Sideways Hint | WAIT";
  }

  if(data.gold > 2700) hint += " | Gold High = Fear = Nifty Down Risk";
  if(data.btc > 68000) hint += " | BTC Up = Risk ON";

  // ===== UI BOX =====
  let box = document.getElementById('both-market');
  if(!box){
    box = document.createElement('div');
    box.id = 'both-market';
    box.style = 'background:#0a0a0a;color:#fff;padding:12px;margin:10px;border-radius:15px;border:2px solid #333;';
    document.body.prepend(box);
  }

  box.innerHTML = `
    <div style="text-align:center;color:#0f0;font-weight:bold;margin-bottom:10px">🌍 INTERNATIONAL + 🇮🇳 INDIAN LIVE</div>

    <div style="background:#111;padding:8px;border-radius:10px;margin-bottom:8px">
      <div style="color:orange;font-size:11px">🇮🇳 INDIAN MARKET</div>
      <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:13px">
        <div>NIFTY: <b style="color:#0f0">${data.nifty.toFixed(2)}</b></div>
        <div>BANK: <b style="color:#0f0">${data.bank.toFixed(0)}</b></div>
        <div>SENSEX: <b style="color:#0f0">${data.sensex.toFixed(0)}</b></div>
      </div>
    </div>

    <div style="background:#111;padding:8px;border-radius:10px;margin-bottom:8px">
      <div style="color:#00aaff;font-size:11px">🌍 INTERNATIONAL</div>
      <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:13px">
        <div>DOW: <b>${data.dow.toFixed(0)}</b></div>
        <div>NASDAQ: <b>${data.nasdaq.toFixed(0)}</b></div>
        <div>GOLD: <b style="color:gold">$${data.gold.toFixed(0)}</b></div>
        <div>BTC: <b style="color:#f7931a">$${data.btc}</b></div>
      </div>
    </div>

    <div style="background:#000;padding:10px;border-radius:8px;border-left:4px solid #0f0">
      <div style="font-size:11px;color:yellow">ANNA I HINT (International -> Indian):</div>
      <div style="font-size:12px;color:#0f0;font-weight:bold;margin-top:3px">${hint}</div>
    </div>
  `;
}

setInterval(getBothMarkets, 3000);
getBothMarkets();
</script>
