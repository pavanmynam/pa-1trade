<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PA1 EPIC BUY SELL</title>
<style>
body{background:#000;color:#fff;margin:0;font-family:system-ui;padding:8px}
.top{background:#0f0;color:#000;padding:12px;text-align:center;font-weight:900;border-radius:14px;font-size:11px}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:12px;margin-top:8px}
.big{font-size:22px;font-weight:900;color:#0f0}
.row{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #1e1e1e;font-size:13px}
.atm{background:#0f0;color:#000;font-weight:900;border-radius:8px}.hero{background:linear-gradient(90deg,#ffeb00,#ff8c00);color:#000;font-weight:900;border-radius:8px}
.btn{width:48%;padding:14px;border:0;border-radius:12px;font-weight:900;font-size:13px;margin-top:6px}
.btnBuy{background:#0f0;color:#000}.btnSell{background:#f00;color:#fff}
.sig{padding:10px;border-radius:12px;font-weight:900;text-align:center;margin-top:8px;font-size:12px}
.call{background:#0f0;color:#000}.put{background:#f00;color:#fff}
.chain{margin-top:10px;background:#0e0e0e;border:1px solid #222;border-radius:14px;padding:10px}
.tag{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:900;background:#0f0;color:#000}
</style></head><body>
<div class="top" id="top">LOADING EPIC...</div>

<!-- NIFTY 50 BUY SELL -->
<div class="card" style="border:1.5px solid #0f0">
<div style="display:flex;justify-content:space-between"><b>📈 NIFTY 50 - <span id="nifty">--</span></b><span class="tag" id="niftyTag">--</span></div>
<div id="niftyTe" style="margin:6px 0;font-size:13px;color:#FFD700;font-weight:800"></div>
<div style="display:flex;justify-content:space-between"><button class="btn btnBuy" id="nBuy">🟢 BUY CALL</button><button class="btn btnSell" id="nSell">🔴 BUY PUT</button></div>
<div class="sig" id="nSig" style="margin-top:8px"></div>
<div id="nchain"></div>
<div style="font-size:11px;margin-top:6px">🎯 HERO: <span id="nhero"></span> | 💥 GAMMA: <span id="ngamma"></span></div>
</div>

<!-- SENSEX BUY SELL -->
<div class="card" style="border:1.5px solid #00f0ff">
<div style="display:flex;justify-content:space-between"><b>📊 SENSEX - <span id="sensex">--</span></b><span class="tag" id="sensexTag" style="background:#00f0ff">--</span></div>
<div id="sensexTe" style="margin:6px 0;font-size:13px;color:#00f0ff;font-weight:800"></div>
<div style="display:flex;justify-content:space-between"><button class="btn btnBuy" id="sBuy" style="background:#00f0ff">🟢 SENSEX CALL BUY</button><button class="btn btnSell" id="sSell">🔴 SENSEX PUT BUY</button></div>
<div id="schain"></div>
</div>

<!-- BANK NIFTY BUY SELL -->
<div class="card" style="border:1.5px solid #ff00ff">
<div style="display:flex;justify-content:space-between"><b>🏦 BANK NIFTY - <span id="bank">--</span></b><span class="tag" id="bankTag" style="background:#ff00ff;color:#fff">--</span></div>
<div style="display:flex;justify-content:space-between"><button class="btn btnBuy" id="bBuy">🟢 BANK CALL BUY</button><button class="btn btnSell" id="bSell">🔴 BANK PUT BUY</button></div>
<div id="bchain"></div>
</div>

<!-- GOLD BUY SELL -->
<div class="card" style="border:1.5px solid #FFD700">
<div style="display:flex;justify-content:space-between"><b>🪙 GOLD - ₹<span id="ginr">--</span> /10g | $<span id="gold">--</span></b><span class="tag" id="goldTag" style="background:#FFD700;color:#000">--</span></div>
<div id="goldTe" style="margin:6px 0;font-size:13px;color:#FFD700;font-weight:800"></div>
<div style="display:flex;justify-content:space-between"><button class="btn btnBuy" id="gBuy" style="background:#FFD700;color:#000">🟢 GOLD BUY</button><button class="btn btnSell" id="gSell">🔴 GOLD SELL</button></div>
<div style="font-size:12px;margin-top:6px">FUT $<span id="gfut">--</span> | Intl $<span id="gold2">--</span> | National ₹<span id="ginr2">--</span></div>
</div>

<!-- BTC BUY SELL -->
<div class="card" style="border:1.5px solid #f7931a">
<div style="display:flex;justify-content:space-between"><b>₿ BITCOIN - $<span id="btc">--</span></b><span class="tag" id="btcTag" style="background:#f7931a">--</span></div>
<div id="btcTe" style="margin:6px 0;font-size:13px;color:#f7931a;font-weight:800"></div>
<div style="display:flex;justify-content:space-between"><button class="btn btnBuy" id="btcBuy" style="background:#f7931a">🟢 BTC BUY</button><button class="btn btnSell" id="btcSell">🔴 BTC SELL</button></div>
<div style="font-size:12px;margin-top:6px">₹<span id="binr">--</span> | ₹<span id="binrL">--</span> Lakshalu</div>
</div>

<!-- SHARES BUY SELL + TOP PROFIT -->
<div class="card" style="border:1.5px solid #0f0">
<b>📦 TOP 10 SHARES - LIVE BUY/SELL + TOP PROFIT HUNT</b>
<div id="topHunt" style="background:#0f0;color:#000;padding:10px;border-radius:10px;font-weight:900;margin:8px 0;font-size:13px"></div>
<div id="topHuntTe" style="background:#FFD700;color:#000;padding:10px;border-radius:10px;font-weight:900;margin:8px 0;font-size:14px"></div>
<div id="slist"></div>
</div>

<div class="sig call" id="mainSig">SIGNAL Loading...</div>

<script>
function makeChain(spot,step,el){
 let atm=Math.round(spot/step)*step; let h=`<div class="row" style="font-weight:900;color:#888"><span>CALL</span><span>STRIKE</span><span>PUT</span></div>`;
 for(let i=-3;i<=3;i++){let s=atm+i*step; let cls=i==0?'atm':(Math.abs(i)>=2?'hero':''); h+=`<div class="row ${cls}"><span>₹${Math.max(5,100-i*10)} ${i==0?'ATM':Math.abs(i)>=2?'HERO ZERO':''}</span><span><b>${s}</b></span><span>${Math.abs(i)>=2?'HERO ZERO':''} ₹${Math.max(5,100+i*10)}</span></div>`;}
 document.getElementById(el).innerHTML=h; return atm;
}
async function load(){
 let r=await fetch('/api/spot?t='+Date.now()); let d=await r.json();
 document.getElementById('top').innerText=`🇮🇳 NIFTY ${d.nifty} | BANK ${d.bank} | GOLD ₹${d.goldInr} | BTC ₹${(d.btcInr/100000).toFixed(1)}L | ${d.hint}`;
 document.getElementById('nifty').innerText=d.nifty+' LIVE'; document.getElementById('bank').innerText=d.bank; document.getElementById('sensex').innerText=d.sensex;
 document.getElementById('gold').innerText=d.gold; document.getElementById('gold2').innerText=d.gold; document.getElementById('ginr').innerText=d.goldInr; document.getElementById('ginr2').innerText=d.goldInr; document.getElementById('gfut').innerText=d.goldFuture;
 document.getElementById('btc').innerText=d.btcUsd; document.getElementById('binr').innerText=d.btcInr.toLocaleString('en-IN'); document.getElementById('binrL').innerText=(d.btcInr/100000).toFixed(1);

 // NIFTY BUTTONS
 document.getElementById('niftyTag').innerText=d.niftyAction; document.getElementById('niftyTe').innerText='🇮🇳 '+d.niftyActionTe;
 document.getElementById('nBuy').innerText=`🟢 BUY ${Math.round(d.nifty/50)*50} CE`; document.getElementById('nSell').innerText=`🔴 BUY ${Math.round(d.nifty/50)*50} PE`;
 document.getElementById('nBuy').style.opacity=d.niftyAction=='BUY'?'1':'0.4'; document.getElementById('nSell').style.opacity=d.niftyAction=='SELL'?'1':'0.4';
 document.getElementById('nSig').innerText='NIFTY SIGNAL: '+d.niftyAction+' | '+d.niftyActionTe; document.getElementById('nSig').className='sig '+(d.niftyAction=='BUY'?'call':'put');

 // SENSEX BUTTONS
 document.getElementById('sensexTag').innerText=d.sensexAction; document.getElementById('sensexTe').innerText='🇮🇳 '+d.sensexActionTe;
 document.getElementById('sBuy').style.opacity=d.sensexAction=='BUY'?'1':'0.4'; document.getElementById('sSell').style.opacity=d.sensexAction=='SELL'?'1':'0.4';

 // BANK BUTTONS
 document.getElementById('bankTag').innerText=d.bankAction;

 // GOLD BUTTONS
 document.getElementById('goldTag').innerText=d.goldAction; document.getElementById('goldTe').innerText='🇮🇳 '+d.goldActionTe;
 document.getElementById('gBuy').style.opacity=d.goldAction=='BUY'?'1':'0.4'; document.getElementById('gSell').style.opacity=d.goldAction=='SELL'?'1':'0.4';

 // BTC BUTTONS
 document.getElementById('btcTag').innerText=d.btcAction; document.getElementById('btcTe').innerText='🇮🇳 '+d.btcActionTe;
 document.getElementById('btcBuy').style.opacity=d.btcAction=='BUY'?'1':'0.4'; document.getElementById('btcSell').style.opacity=d.btcAction=='SELL'?'1':'0.4';

 // CHAINS
 let nAtm=makeChain(parseFloat(d.nifty),50,'nchain'); document.getElementById('nhero').innerText=`${nAtm+200} CE ₹5 | ${nAtm-200} PE ₹5`; document.getElementById('ngamma').innerText=`${nAtm} break -> BLAST`;
 makeChain(parseFloat(d.sensex),100,'schain'); makeChain(parseFloat(d.bank),100,'bchain');

 // SHARES WITH BUY SELL BUTTONS
 document.getElementById('topHunt').innerText=d.topHunt; document.getElementById('topHuntTe').innerText=d.topHuntTe;
 let sl=''; d.shares.forEach(s=>{
   let up=s.action=='BUY';
   sl+=`<div class="card" style="padding:8px;margin-top:6px;background:${up?'#001a00':'#1a0000'}"><div style="display:flex;justify-content:space-between"><span><b>${s.name}</b> ₹${Number(s.price).toFixed(0)}<br><small style="color:${up?'#0f0':'#f44'}">${s.change}% ${s.actionTe}</small></span><span style="color:${up?'#0f0':'#f44'};font-weight:900">${up?'🟢 BUY':'🔴 SELL'}</span></div><div style="display:flex;justify-content:space-between"><button class="btn btnBuy" style="padding:8px;opacity:${up?'1':'0.3'}">BUY ${s.name}</button><button class="btn btnSell" style="padding:8px;opacity:${!up?'1':'0.3'}">SELL ${s.name}</button></div></div>`;
 });
 document.getElementById('slist').innerHTML=sl;
 document.getElementById('mainSig').innerText=d.signal+' | '+d.hint;
}
load(); setInterval(load,5000);
</script></body></html>
